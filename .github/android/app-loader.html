<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f0">
  <title>Inhouse Read</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #f5f5f0; color: #1a1a1a; }
    body {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      box-sizing: border-box;
      font: 600 15px system-ui, sans-serif;
    }
    .launch-mark { display: grid; justify-items: center; gap: 12px; opacity: .82; }
    svg { width: 54px; height: 34px; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #151515; color: #f5f5f5; }
    }
  </style>
  <script>
    // Igual que en Inhouse Notes: un frame local pintado antes de navegar,
    // para que Android nunca enseñe una pantalla en blanco mientras carga
    // el sitio real.
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        window.location.replace("https://miguelcoxcaballero.github.io/inhouse-read/?inhouse_app=1");
      });
    });
  </script>
</head>
<body>
  <div class="launch-mark" aria-label="Abriendo Inhouse Read">
    <svg viewBox="0 0 40 24" fill="none" aria-hidden="true">
      <path d="M4 22 L20 6 L36 22" stroke="#2f6b4f" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <span>inhouse read</span>
  </div>
</body>
</html>
