<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f0">
  <title>Inhouse Read</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #f5f5f0; color: #1a1a1a; }
    body {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      box-sizing: border-box;
      font: 600 15px system-ui, sans-serif;
    }
    .launch-mark { display: grid; justify-items: center; gap: 12px; opacity: .82; }
    svg { width: 22px; height: 36px; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #151515; color: #f5f5f5; }
    }
  </style>
  <script>
    // Se navega en el acto, sin esperar a pintar este documento: la ventana
    // y el WebView nativos ya tienen el color de arranque (MainActivity y el
    // tema), así que Android no enseña una pantalla en blanco, y el sitio
    // real empieza a cargar dos fotogramas antes.
    //
    // El "&t=" con la hora actual es a propósito, no decorativo: sin él,
    // esta navegación es una URL fija ("...?inhouse_app=1") y la caché HTTP
    // del propio WebView de Android puede reutilizar una respuesta vieja de
    // esa URL exacta en un arranque en frío (proceso nuevo, WebView nuevo,
    // pero disco de caché persistente entre instalaciones/actualizaciones).
    // Al ir la marca de tiempo en la query string, cada arranque pide una
    // URL distinta que nunca ha estado en caché. Con el service worker
    // instalado, la navegación se sirve de su copia offline igualmente.
    window.location.replace(
      "https://miguelcoxcaballero.github.io/inhouse-read/?inhouse_app=1&t=" + Date.now()
    );
  </script>
</head>
<body>
  <div class="launch-mark" aria-label="Abriendo Inhouse Read">
    <svg viewBox="36 25 36 58" fill="none" aria-hidden="true">
      <path d="M43 27 H65 A5 5 0 0 1 70 32 V81 L54 71 L38 81 V32 A5 5 0 0 1 43 27 Z" fill="#1E9E66" stroke="#1E9E66" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M45 53.5 L54 44.5 L63 53.5" stroke="#FFFFFF" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>inhouse read</span>
  </div>
</body>
</html>
