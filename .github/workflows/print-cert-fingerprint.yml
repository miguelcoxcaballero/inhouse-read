name: Print release cert SHA-1 (temporary, for Google OAuth Android client setup)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  print-fingerprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.INHOUSE_READ_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/inhouse-read-release.jks"

      # Solo se imprimen las lineas SHA1:/SHA256: (huella publica del
      # certificado, lo que Google pide pegar al crear un cliente OAuth
      # "Android" -- no es secreto). El resto de la salida de keytool
      # (Owner/Issuer, que podria llevar datos que el usuario metiera al
      # generar la clave) se descarta a proposito, igual que la contrasena,
      # que nunca se imprime.
      - name: Extraer solo la huella SHA-1/SHA-256 del certificado
        env:
          INHOUSE_KEYSTORE_PASSWORD: ${{ secrets.INHOUSE_READ_ANDROID_KEYSTORE_PASSWORD }}
          INHOUSE_KEY_ALIAS: ${{ secrets.INHOUSE_READ_ANDROID_KEY_ALIAS }}
        run: |
          keytool -list -v \
            -keystore "$RUNNER_TEMP/inhouse-read-release.jks" \
            -alias "$INHOUSE_KEY_ALIAS" \
            -storepass "$INHOUSE_KEYSTORE_PASSWORD" \
            | grep -E "^\s*SHA1:|^\s*SHA256:"
