name: Build and publish signed Android APK

on:
  workflow_dispatch:

permissions:
  contents: write
  # Necesario para poder disparar deploy-pages.yml via workflow_dispatch al
  # final (ver mas abajo) -- sin esto, gh workflow run devuelve 403
  # "Resource not accessible by integration" aunque contents:write ya deje
  # comitear/empujar el propio manifiesto sin problema.
  actions: write

concurrency:
  group: publish-android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref }}", fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Install builder dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tesseract-ocr
          python -m pip install --disable-pip-version-check pillow

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.INHOUSE_READ_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/inhouse-read-release.jks"

      - name: Check Android display verifier
        run: python .github/scripts/test_verify_android_app.py && python .github/scripts/test_verify_android_background.py && python .github/scripts/test_android_shell.py && python .github/scripts/test_native_pcm_clock.py && python .github/scripts/test_verify_release_apk.py

      - name: Build signed APK
        env:
          INHOUSE_KEYSTORE_PATH: ${{ runner.temp }}/inhouse-read-release.jks
          INHOUSE_KEYSTORE_PASSWORD: ${{ secrets.INHOUSE_READ_ANDROID_KEYSTORE_PASSWORD }}
          INHOUSE_KEY_ALIAS: ${{ secrets.INHOUSE_READ_ANDROID_KEY_ALIAS }}
        run: python .github/scripts/build_android_apk.py

      - run: test -s inhouse-read-release-v1.1.23.apk

      - name: Verify APK identity and signing continuity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/previous-apk"
          gh release download android-v1.1.13 --pattern inhouse-read-release-v1.1.13.apk --dir "$RUNNER_TEMP/previous-apk"
          python .github/scripts/verify_release_apk.py inhouse-read-release-v1.1.23.apk "$RUNNER_TEMP/previous-apk/inhouse-read-release-v1.1.13.apk"

      - name: Confirm the signed APK contains only the production loader
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          with ZipFile('inhouse-read-release-v1.1.23.apk') as apk:
              loader = apk.read('assets/public/index.html')
              assert len(loader) < 3000, f'Full app was bundled ({len(loader)} bytes)'
              assert b'miguelcoxcaballero.github.io/inhouse-read/' in loader
              assert b'location.replace' in loader or b'location.href' in loader
              dex = b''.join(apk.read(name) for name in apk.namelist() if name.endswith('.dex'))
              assert b'BookImportBridge' in dex and b'InhouseBookImports' in dex, 'Native ebook import bridge missing'
              assert b'setReadingMode' in dex, 'Native reader display policy missing'
              assert b'setReaderOwnership' in dex, 'Native reader lifecycle ownership missing'
              assert b'getSafeTopInset' in dex and b'setStatusBarAppearance' in dex, 'Status bar overlay bridge missing'
              # MainActivity owns the insets: Capacitor must not pad the window by the status bar.
              import json
              system_bars = json.loads(apk.read('assets/capacitor.config.json')).get('plugins', {}).get('SystemBars', {})
              assert system_bars.get('insetsHandling') == 'disable', 'Capacitor SystemBars still pads the window'
              assert b'moveTaskToBack' in dex and b'OnBackPressedCallback' in dex, 'Back at the shelf must keep the app alive'
              assert b'setRendererPriorityPolicy' in dex, 'WebView renderer priority policy missing'
              assert b'ReadAloudBridge' in dex and b'InhouseSpeech' in dex and b'inhouse-tts' in dex, 'Native speech bridge missing'
              assert b'NativePcmService' in dex and b'InhousePcm' in dex and b'InhousePcmState' in dex, 'Natural PCM foreground service missing'
              assert b'NativeInferenceBridge' in dex and b'InhouseInference' in dex, 'Natural voice native inference missing'
              # Capacitor already uses androidx FileProvider; a shared class breaks update URIs.
              manifest = apk.read('AndroidManifest.xml').decode('utf-16-le', 'ignore')
              assert b'Lcom/inhouse/services/updater/UpdateFileProvider;' in dex and 'com.inhouse.services.updater.UpdateFileProvider' in manifest, 'Update provider must have its own class'
              for abi in ('arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'):
                  for library in ('libonnxruntime.so', 'libonnxruntime4j_jni.so'):
                      assert apk.getinfo(f'lib/{abi}/{library}').file_size > 0, f'Native inference library missing: {abi}/{library}'
              print(f'Production loader verified: {len(loader)} bytes')
          PY

      - name: Build disposable Android installer test
        run: python .github/scripts/verify_android_installer.py --build

      # El solapamiento de la cabecera sólo se ve dentro de una ventana Android;
      # el build y Playwright de escritorio no pueden detectarlo.
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Select Android emulator DNS
        id: runner-dns
        shell: bash
        run: |
          servers=$(awk '$1 == "nameserver" && $2 ~ /^[0-9]+\./ && $2 !~ /^127\./ { print $2 }' /etc/resolv.conf | head -n 3 | paste -sd, -)
          echo "servers=${servers:+$servers,}1.1.1.1" >> "$GITHUB_OUTPUT"

      - name: Capture the installed APK on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          # El emulador de GitHub Actions no siempre hereda un DNS funcional.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -dns-server ${{ steps.runner-dns.outputs.servers }}
          script: |
            set -e
            python .github/scripts/verify_android_installer.py --verify
            python .github/scripts/verify_android_app.py inhouse-read-release-v1.1.23.apk --book-imports
            python .github/scripts/verify_android_background.py inhouse-read-release-v1.1.23.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inhouse-read-android-status-bar
          path: |
            android-status-bar.png
            android-ui.xml
            android-screen-text.txt
            android-open-with.*
            android-import-*.png
            android-import-*.xml
            android-logcat.txt
            android-reading-*
            android-background-*
            android-updater-*
            android-*.capture-errors.json
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with: { name: inhouse-read-android-v1.1.23, path: inhouse-read-release-v1.1.23.apk, if-no-files-found: error }

      - uses: actions/upload-artifact@v4
        with: { name: inhouse-read-android-intent-fixture-v1.1.23, path: intent-fixture-debug.apk, if-no-files-found: error }

      - name: Publish versioned APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-v1.1.23 >/dev/null 2>&1; then
            echo "La versión ya está publicada; incrementa versionName/versionCode antes de generar otra APK."
            exit 1
          else
            gh release create android-v1.1.23 inhouse-read-release-v1.1.23.apk \
              --target "$GITHUB_SHA" \
              --title "Inhouse Read Android 1.1.23" \
              --notes "Bigger cover, less text in the widget." \
              --prerelease --latest=false
          fi
          gh release edit android-v1.1.23 --prerelease --latest=false

      - name: Verify public APK before its catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/public-apk"
          gh release download android-v1.1.23 --pattern inhouse-read-release-v1.1.23.apk --dir "$RUNNER_TEMP/public-apk"
          cmp inhouse-read-release-v1.1.23.apk "$RUNNER_TEMP/public-apk/inhouse-read-release-v1.1.23.apk"
          python .github/scripts/verify_release_apk.py "$RUNNER_TEMP/public-apk/inhouse-read-release-v1.1.23.apk" "$RUNNER_TEMP/previous-apk/inhouse-read-release-v1.1.13.apk"

      # Fuente unica de verdad para src/js/android-update.js: tamano y
      # sha256 calculados sobre el APK real que se acaba de firmar y
      # publicar, nunca copiados a mano. El push a main dispara el deploy
      # de Pages normal, así que el sitio en vivo pasa a servir el
      # manifiesto actualizado en su siguiente despliegue automático.
      - name: Actualizar android-update.json con los datos reales de este build
        run: |
          python .github/scripts/update_manifest.py \
            inhouse-read-release-v1.1.23.apk \
            1.1.23 \
            36 \
            android-v1.1.23 \
            "Bigger cover, less text in the widget."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python vendor/inhouse-services-updater/catalog.py --channel A --manifest public/android-update.json --changelog "Bigger cover, less text in the widget."
          git add public/android-update.json updates/A.json updates/B.json
          if git diff --cached --quiet; then
            echo "android-update.json ya estaba al dia, nada que comitear"
          else
            git commit -m "Actualizar android-update.json a la version publicada (automatico) [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      # Un push hecho con el GITHUB_TOKEN por defecto NO dispara otros
      # workflows (proteccion anti-bucle de GitHub Actions) -- sin este paso,
      # el manifiesto ya estaria actualizado en el repo pero el sitio en vivo
      # seguiria sirviendo el anterior hasta el proximo push manual. Se
      # dispara deploy-pages.yml explicitamente via workflow_dispatch (una
      # invocacion de API explicita si cuenta, a diferencia del push-event
      # automatico).
      - name: Redesplegar Pages para servir el manifiesto actualizado
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --repo miguelcoxcaballero/inhouse-read
