name: Build and publish signed Android APK

on:
  workflow_dispatch:

permissions:
  contents: write
  # Necesario para poder disparar deploy-pages.yml via workflow_dispatch al
  # final (ver mas abajo) -- sin esto, gh workflow run devuelve 403
  # "Resource not accessible by integration" aunque contents:write ya deje
  # comitear/empujar el propio manifiesto sin problema.
  actions: write

concurrency:
  group: publish-android-apk
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Install builder dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          python -m pip install --disable-pip-version-check pillow

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.INHOUSE_READ_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/inhouse-read-release.jks"

      - name: Build signed APK
        env:
          INHOUSE_KEYSTORE_PATH: ${{ runner.temp }}/inhouse-read-release.jks
          INHOUSE_KEYSTORE_PASSWORD: ${{ secrets.INHOUSE_READ_ANDROID_KEYSTORE_PASSWORD }}
          INHOUSE_KEY_ALIAS: ${{ secrets.INHOUSE_READ_ANDROID_KEY_ALIAS }}
        run: python .github/scripts/build_android_apk.py

      - run: test -s inhouse-read-release-v1.0.8.apk

      # El solapamiento de la cabecera sólo se ve dentro de una ventana Android;
      # el build y Playwright de escritorio no pueden detectarlo.
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture the installed APK on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          script: |
            adb install -r inhouse-read-release-v1.0.8.apk
            adb shell am start -n com.inhousesoftware.read/.MainActivity
            sleep 15
            adb shell screencap -p /sdcard/inhouse-read-status-bar.png
            adb pull /sdcard/inhouse-read-status-bar.png android-status-bar.png
            adb shell uiautomator dump /sdcard/inhouse-read-ui.xml
            adb pull /sdcard/inhouse-read-ui.xml android-ui.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inhouse-read-android-status-bar
          path: |
            android-status-bar.png
            android-ui.xml
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with: { name: inhouse-read-android-v1.0.8, path: inhouse-read-release-v1.0.8.apk, if-no-files-found: error }

      - name: Publish versioned APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-v1.0.8 >/dev/null 2>&1; then
            gh release upload android-v1.0.8 inhouse-read-release-v1.0.8.apk --clobber
          else
            gh release create android-v1.0.8 inhouse-read-release-v1.0.8.apk \
              --title "Inhouse Read Android 1.0.8" \
              --notes "Corregido el solapamiento de la barra de estado: la ventana reserva el espacio de las barras del sistema antes de mostrar el lector."
          fi
          gh release edit android-v1.0.8 --latest

      # Fuente unica de verdad para src/js/android-update.js: tamano y
      # sha256 calculados sobre el APK real que se acaba de firmar y
      # publicar, nunca copiados a mano. El push a main dispara el deploy
      # de Pages normal, así que el sitio en vivo pasa a servir el
      # manifiesto actualizado en su siguiente despliegue automático.
      - name: Actualizar android-update.json con los datos reales de este build
        run: |
          python .github/scripts/update_manifest.py \
            inhouse-read-release-v1.0.8.apk \
            1.0.8 \
            9 \
            android-v1.0.8 \
            "Corregido el solapamiento de la barra de estado: la ventana reserva el espacio de las barras del sistema antes de mostrar el lector."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/android-update.json
          if git diff --cached --quiet; then
            echo "android-update.json ya estaba al dia, nada que comitear"
          else
            git commit -m "Actualizar android-update.json a la version publicada (automatico)"
            git push origin HEAD:main
          fi

      # Un push hecho con el GITHUB_TOKEN por defecto NO dispara otros
      # workflows (proteccion anti-bucle de GitHub Actions) -- sin este paso,
      # el manifiesto ya estaria actualizado en el repo pero el sitio en vivo
      # seguiria sirviendo el anterior hasta el proximo push manual. Se
      # dispara deploy-pages.yml explicitamente via workflow_dispatch (una
      # invocacion de API explicita si cuenta, a diferencia del push-event
      # automatico).
      - name: Redesplegar Pages para servir el manifiesto actualizado
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --repo miguelcoxcaballero/inhouse-read
