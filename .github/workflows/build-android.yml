name: Build and publish signed Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-android-apk
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Install builder dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          python -m pip install --disable-pip-version-check pillow

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.INHOUSE_READ_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/inhouse-read-release.jks"

      - name: Build signed APK
        env:
          INHOUSE_KEYSTORE_PATH: ${{ runner.temp }}/inhouse-read-release.jks
          INHOUSE_KEYSTORE_PASSWORD: ${{ secrets.INHOUSE_READ_ANDROID_KEYSTORE_PASSWORD }}
          INHOUSE_KEY_ALIAS: ${{ secrets.INHOUSE_READ_ANDROID_KEY_ALIAS }}
        run: python .github/scripts/build_android_apk.py

      - run: test -s inhouse-read-release-v1.0.3.apk

      - uses: actions/upload-artifact@v4
        with: { name: inhouse-read-android-v1.0.3, path: inhouse-read-release-v1.0.3.apk, if-no-files-found: error }

      - name: Publish versioned APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-v1.0.3 >/dev/null 2>&1; then
            gh release upload android-v1.0.3 inhouse-read-release-v1.0.3.apk --clobber
          else
            gh release create android-v1.0.3 inhouse-read-release-v1.0.3.apk \
              --title "Inhouse Read Android 1.0.3" \
              --notes "Detecta cuando el sitio se ha desplegado de nuevo mientras la app seguia abierta y recarga sola (arregla la app quedandose con contenido viejo tras reabrir sin cerrar del todo). Sin cambios nativos: se publica esta version sobre todo para que las instalaciones existentes reciban el aviso de actualizacion y, al instalarlo, un reinicio limpio del proceso." \
              --latest=false
          fi

      # Fuente unica de verdad para src/js/android-update.js: tamano y
      # sha256 calculados sobre el APK real que se acaba de firmar y
      # publicar, nunca copiados a mano. El push a main dispara el deploy
      # de Pages normal, así que el sitio en vivo pasa a servir el
      # manifiesto actualizado en su siguiente despliegue automático.
      - name: Actualizar android-update.json con los datos reales de este build
        run: |
          python .github/scripts/update_manifest.py \
            inhouse-read-release-v1.0.3.apk \
            1.0.3 \
            4 \
            android-v1.0.3 \
            "Arregla que la app se quedara con contenido viejo tras reabrir sin cerrar del todo (deteccion automatica de nuevos despliegues + recarga)."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/android-update.json
          if git diff --cached --quiet; then
            echo "android-update.json ya estaba al dia, nada que comitear"
          else
            git commit -m "Actualizar android-update.json a la version publicada (automatico)"
            git push origin HEAD:main
          fi

      # Un push hecho con el GITHUB_TOKEN por defecto NO dispara otros
      # workflows (proteccion anti-bucle de GitHub Actions) -- sin este paso,
      # el manifiesto ya estaria actualizado en el repo pero el sitio en vivo
      # seguiria sirviendo el anterior hasta el proximo push manual. Se
      # dispara deploy-pages.yml explicitamente via workflow_dispatch (una
      # invocacion de API explicita si cuenta, a diferencia del push-event
      # automatico).
      - name: Redesplegar Pages para servir el manifiesto actualizado
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --repo miguelcoxcaballero/inhouse-read
