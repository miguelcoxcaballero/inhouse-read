name: Production checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Unit tests (Vitest)
        run: npm run test:unit

      - name: E2E (Playwright, contra el build de producción)
        # "pretest:e2e" (ver package.json) hace "vite build" antes de correr
        # Playwright, así que esto ya prueba el bundle real de producción.
        # Keep one software WebGL context active on this runner. Parallel
        # rendering competes for its graphics process and stalls unrelated
        # animation, screenshot and even pointer commands.
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report/results.json
        run: npm run test:e2e -- --workers=1 --reporter=list,json

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
