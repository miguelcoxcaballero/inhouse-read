name: Verify published Android login and reader

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published APK version to verify
        required: true
        default: '1.1.3'
      fixture_run_id:
        description: Android build run containing the intent fixture for reader verification
        required: false

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Download the public release artifact
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release download "android-v$VERSION" --pattern '*.apk' --output published.apk
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - name: Download the reader import fixture from its build
        if: inputs.fixture_run_id != ''
        env:
          FIXTURE_RUN_ID: ${{ inputs.fixture_run_id }}
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$FIXTURE_RUN_ID" =~ ^[0-9]+$ ]]
          gh run download "$FIXTURE_RUN_ID" --name "inhouse-read-android-intent-fixture-v$VERSION" --dir .
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Use the runner's working DNS servers
        id: runner-dns
        shell: bash
        run: |
          servers=$(awk '$1 == "nameserver" && $2 ~ /^[0-9]+\./ && $2 !~ /^127\./ { print $2 }' /etc/resolv.conf | head -n 3 | paste -sd, -)
          echo "servers=${servers:+$servers,}1.1.1.1" >> "$GITHUB_OUTPUT"
      - name: Open the actual APK and Google sign-in
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -dns-server ${{ steps.runner-dns.outputs.servers }}
          script: python -u .github/scripts/verify_android_app.py published.apk --google-login
      - name: Verify the published reader display policy
        if: inputs.fixture_run_id != ''
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -dns-server ${{ steps.runner-dns.outputs.servers }}
          script: python -u .github/scripts/verify_android_app.py published.apk --reading-display
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-android-login
          path: |
            android-status-bar.png
            android-ui.xml
            android-screen-text.txt
            android-google-login.png
            android-google-login.xml
            android-google-login.txt
            android-logcat.txt
            android-reading-*
