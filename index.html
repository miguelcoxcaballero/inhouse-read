<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f0" />
  <title>Inhouse Read</title>
  <meta name="description" content="Inhouse Read — lector de PDF, ePub y MOBI." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@700;800&display=swap">


  <script type="module" crossorigin src="/inhouse-read/assets/main-iu0hMX7k.js"></script>
  <link rel="modulepreload" crossorigin href="/inhouse-read/assets/base-DRMcTq8m.js">
  <link rel="stylesheet" crossorigin href="/inhouse-read/assets/base-nC-T2dVX.css">
  <link rel="stylesheet" crossorigin href="/inhouse-read/assets/main-BJPzi5Qt.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <span class="logo">
        <svg class="logo-mark" viewBox="0 0 40 28" xmlns="http://www.w3.org/2000/svg" fill="none">
          <path d="M4 24 L20 8 L36 24" stroke="var(--accent-read)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        inhouse read
      </span>
      <div class="header-actions">
        <button id="add-local-btn" class="icon-btn" type="button" aria-label="Elegir archivo del dispositivo">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>
          </svg>
        </button>
        <button id="add-drive-btn" class="icon-btn" type="button" aria-label="Abrir desde Google Drive">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7.5 3h9l6 10.5-3 5.5h-15l-3-5.5L7.5 3z"/><path d="M7.5 3l6 10.5M16.5 13.5h6.5"/>
          </svg>
        </button>
        <div id="drive-profile" class="drive-profile" hidden>
          <button id="drive-profile-btn" class="drive-profile-btn" type="button" aria-label="Cuenta de Google" aria-haspopup="true" aria-expanded="false">
            <span id="drive-profile-initial" class="drive-profile-initial" aria-hidden="true">G</span>
            <img id="drive-profile-avatar" class="drive-profile-avatar" alt="" hidden />
          </button>
          <div id="drive-profile-menu" class="drive-profile-menu" role="menu" hidden>
            <div class="drive-profile-meta">
              <span id="drive-profile-initial-menu" class="drive-profile-avatar-fallback" aria-hidden="true">G</span>
              <img id="drive-profile-avatar-menu" class="drive-profile-avatar" alt="" hidden />
              <div class="drive-profile-copy">
                <div id="drive-profile-name" class="drive-profile-name">Cuenta de Google</div>
                <div id="drive-profile-email" class="drive-profile-email"></div>
              </div>
            </div>
            <p id="drive-sync-status" class="drive-sync-status" role="status">Conectado con Google Drive</p>
            <div class="drive-profile-actions">
              <button id="drive-sync-btn" class="drive-menu-btn" type="button" role="menuitem">Sincronizar ahora</button>
              <button id="drive-signout-btn" class="drive-menu-btn" type="button" role="menuitem">Cerrar sesión</button>
            </div>
          </div>
        </div>
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="Cambiar tema">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
        </button>
      </div>
    </header>

    <section id="home-screen" class="screen" data-screen="home">
      <div id="bookshelf-root"></div>
    </section>

    <section id="reader-screen" class="screen" data-screen="reader" hidden>
      <div id="reader-viewport" class="reader-viewport"></div>
      <div id="reader-toolbar" class="reader-toolbar">
        <button id="reader-back" class="icon-btn" type="button" aria-label="Volver a la estantería">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </button>
        <button id="reader-prev" class="icon-btn" type="button" aria-label="Página anterior">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/>
          </svg>
        </button>
        <div class="reader-progress"><div id="reader-progress-fill" class="reader-progress-fill"></div></div>
        <span id="reader-format-badge" class="file-format-badge"></span>
        <button id="reader-next" class="icon-btn" type="button" aria-label="Página siguiente">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 17l5-5-5-5M6 17l5-5-5-5"/>
          </svg>
        </button>
      </div>
    </section>
  </div>

  <input id="file-picker" type="file" accept=".pdf,.epub,.mobi,.azw,.azw3,.fb2,.cbz" class="visually-hidden" />

  <div id="drive-modal" class="drive-modal" hidden>
    <div class="drive-modal-card">
      <div class="drive-modal-header">
        <span class="logo">Google Drive</span>
        <button id="drive-close" class="icon-btn" type="button" aria-label="Cerrar">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 6l12 12M18 6L6 18"/>
          </svg>
        </button>
      </div>
      <p id="drive-status" class="drive-status"></p>
      <div id="drive-list" class="drive-list"></div>
    </div>
  </div>

</body>
</html>
