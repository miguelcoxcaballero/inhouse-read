<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f0" />
  <title>Inhouse Read</title>
  <meta name="description" content="Inhouse Read — lector de PDF, ePub y MOBI." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;600;700&family=Lora:wght@600;700&family=Montserrat:wght@600;700&family=Oswald:wght@500;600;700&family=Playfair+Display:wght@600;700;800&display=swap">

  <script>
    // Google Identity Services only serves the web sign-in popup. The Android
    // shell signs in natively (PKCE), so its WebView skips downloading and
    // running the library while the shelf is starting.
    if (!/\bInhouseReadApp\/\d/i.test(navigator.userAgent)) {
      const gsi = document.createElement('script')
      gsi.src = 'https://accounts.google.com/gsi/client'; gsi.async = true
      document.head.append(gsi)
    }
  </script>

  <script type="module" crossorigin src="/inhouse-read/assets/main-BRD4MG9i.js"></script>
  <link rel="modulepreload" crossorigin href="/inhouse-read/assets/base-COVc8yu5.js">
  <link rel="stylesheet" crossorigin href="/inhouse-read/assets/base-COHSqPRx.css">
  <link rel="stylesheet" crossorigin href="/inhouse-read/assets/main-Cl5VGDx_.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <span class="logo">
        <svg class="logo-mark" viewBox="0 0 40 28" xmlns="http://www.w3.org/2000/svg" fill="none">
          <path d="M4 24 L20 8 L36 24" stroke="var(--accent-read)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        inhouse read
      </span>
      <div class="reader-heading">
        <button id="reader-back" class="icon-btn" type="button" aria-label="Volver a la estantería">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </button>
        <span class="reader-heading-copy"><span id="reader-top-title">Abriendo libro…</span><small id="reader-top-byline"></small></span>
        <div class="reader-heading-actions" aria-label="Herramientas del libro">
          <button id="reader-search-shortcut" class="icon-btn" type="button" aria-label="Buscar en el libro" title="Buscar en el libro"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg></button>
          <button id="reader-focus" class="icon-btn" type="button" aria-label="Ocultar controles" title="Leer a pantalla completa" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></svg></button>
          <button id="reader-more-shortcut" class="icon-btn" type="button" aria-label="Más opciones del libro" title="Más opciones"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r=".8"/><circle cx="12" cy="12" r=".8"/><circle cx="19" cy="12" r=".8"/></svg></button>
        </div>
      </div>
      <div class="header-actions">
        <button id="add-local-btn" class="icon-btn" type="button" aria-label="Elegir archivo del dispositivo" title="Añadir libro del dispositivo">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/><path d="M12 10v7m-3-3.5h6"/>
          </svg>
        </button>
        <button id="add-drive-btn" class="icon-btn" type="button" aria-label="Abrir desde Google Drive" title="Abrir desde Google Drive">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 3h6l7 12-3 5H5l-3-5L9 3Z"/><path d="m9 3 7 12H2m13-12L8 15l3 5"/>
          </svg>
        </button>
        <button id="drive-connect-btn" class="drive-connect-btn" type="button" aria-label="Conectar cuenta de Google" title="Conectar cuenta de Google"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 19.5c1.2-3.3 3.9-5 7-5s5.8 1.7 7 5"/></svg>Iniciar sesión</button>
        <div id="drive-profile" class="drive-profile" hidden>
          <button id="drive-profile-btn" class="drive-profile-btn" type="button" aria-label="Cuenta de Google" aria-haspopup="menu" aria-controls="drive-profile-menu" aria-expanded="false">
            <span id="drive-profile-initial" class="drive-profile-initial" aria-hidden="true">G</span>
            <img id="drive-profile-avatar" class="drive-profile-avatar" alt="" hidden />
          </button>
          <div id="drive-profile-menu" class="drive-profile-menu" role="menu" hidden>
            <div class="drive-profile-meta">
              <span id="drive-profile-initial-menu" class="drive-profile-avatar-fallback" aria-hidden="true">G</span>
              <img id="drive-profile-avatar-menu" class="drive-profile-avatar" alt="" hidden />
              <div class="drive-profile-copy">
                <div id="drive-profile-name" class="drive-profile-name">Cuenta de Google</div>
                <div id="drive-profile-email" class="drive-profile-email"></div>
              </div>
            </div>
            <label class="drive-theme-row" for="drive-theme-toggle"><span>Modo oscuro</span><input id="drive-theme-toggle" type="checkbox" aria-label="Modo oscuro" /></label>
            <p id="drive-sync-status" class="drive-sync-status" role="status" aria-live="polite">Conectado</p>
            <div class="drive-profile-actions">
              <button id="drive-sync-btn" class="drive-menu-btn" type="button" role="menuitem" aria-label="Sincronizar ahora">Sincronizar</button>
              <button id="drive-signout-btn" class="drive-menu-btn" type="button" role="menuitem">Cerrar sesión</button>
            </div>
            <small id="app-version" class="drive-app-version"></small>
          </div>
        </div>
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="Cambiar tema" title="Cambiar tema">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
        </button>
      </div>
    </header>
    <div id="drive-auth-notice" class="drive-auth-notice" role="status" aria-live="polite" hidden>
      <span id="drive-auth-message"></span>
      <button id="drive-auth-retry" class="drive-menu-btn" type="button" hidden>Reintentar</button>
      <button id="drive-auth-cancel" class="drive-menu-btn" type="button" hidden>Cancelar</button>
      <button id="drive-auth-dismiss" class="icon-btn" type="button" aria-label="Cerrar aviso"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    </div>

    <section id="home-screen" class="screen" data-screen="home">
      <div id="bookshelf-root"></div>
    </section>

    <section id="reader-screen" class="screen" data-screen="reader" hidden>
      <p id="reader-loading" class="reader-loading" role="status" hidden>Abriendo el libro…</p>
      <div id="reader-viewport" class="reader-viewport" tabindex="-1"></div>
      <div id="reader-toolbar" class="reader-toolbar">
        <button id="reader-prev" class="icon-btn" type="button" aria-label="Página anterior">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 6l-6 6 6 6"/>
          </svg>
        </button>
        <button id="reader-location" class="reader-location" type="button" aria-label="Progreso y capítulos"><span class="reader-location-label">Página 1</span><span class="reader-progress"><span id="reader-progress-fill" class="reader-progress-fill"></span></span></button>
        <span id="reader-format-badge" class="file-format-badge"></span>
        <button id="reader-next" class="icon-btn" type="button" aria-label="Página siguiente">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m10 6 6 6-6 6"/>
          </svg>
        </button>
        <button id="reader-save-bookmark" class="icon-btn" type="button" aria-label="Guardar marcador" title="Guardar marcador"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12v17l-6-4-6 4V4Z"/></svg></button>
        <button id="reader-settings" class="icon-btn" type="button" aria-label="Aspecto de lectura" title="Texto y aspecto"><span class="reader-type-icon" aria-hidden="true">Aa</span></button>
        <button id="reader-audio" class="icon-btn" type="button" aria-label="Escuchar el libro" title="Escuchar el libro"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14v-3a8 8 0 0 1 16 0v3M4 13H3v7h4v-7H4Zm16 0h1v7h-4v-7h3Z"/></svg></button>
      </div>
    </section>
  </div>

  <div id="drive-upload-screen" class="drive-upload-screen" role="status" aria-live="polite" aria-busy="false" hidden>
    <div class="drive-upload-card">
      <span class="drive-upload-spinner" aria-hidden="true"></span>
      <p class="drive-upload-brand">inhouse read</p>
      <h1 id="drive-upload-title">Subiendo a Google Drive</h1>
      <p id="drive-upload-book" class="drive-upload-book"></p>
      <div class="drive-upload-track" aria-hidden="true"><span></span></div>
          </div>
  </div>

  <input id="file-picker" type="file" accept=".pdf,.epub,.mobi,.azw,.azw3,.fb2,.cbz" class="visually-hidden" />

  <div id="drive-modal" class="drive-modal" hidden>
    <div class="drive-modal-card">
      <div class="drive-modal-header">
        <span class="logo">Google Drive</span>
        <button id="drive-close" class="icon-btn" type="button" aria-label="Cerrar">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 6l12 12M18 6L6 18"/>
          </svg>
        </button>
      </div>
      <p id="drive-status" class="drive-status"></p>
      <div id="drive-list" class="drive-list"></div>
    </div>
  </div>

</body>
</html>
