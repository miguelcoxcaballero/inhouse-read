  <script>
    // A launch is answered from the offline shell without the network. The
    // deployed index.html is asked for right away, so content-freshness.js
    // often knows of a newer deploy before the shelf is built and opens it
    // instead of building the old one.
    try {
      (function (deployed) {
        deployed.done = fetch(location.href, { cache: 'no-store' })
          .then(function (response) { return response.ok ? response.text() : null })
          .then(function (html) { return deployed.html = html }, function () { return null })
        window.__inhouseDeployed = deployed
      })({ html: null })
    } catch (error) { /* content-freshness.js asks later */ }
    // The shelf's records are read while the app's code is still loading, so
    // its first frame does not wait for IndexedDB afterwards. Only an existing
    // library at the current schema (src/js/library-store.js) is read here;
    // anything else is left to the store. src/js/shelf-boot.js takes the result.
    try {
      (function (open, read) {
        read.done = new Promise(function (resolve) {
          open.onupgradeneeded = function () { open.transaction.abort() }
          open.onerror = function () { resolve(null) }
          open.onsuccess = function () {
            var db = open.result
            try {
              var request = db.transaction('books', 'readonly').objectStore('books').getAll()
              request.onsuccess = function () { resolve(read.records = request.result) }
              request.onerror = function () { resolve(null) }
            } catch (error) { resolve(null) }
            db.close()
          }
        })
        window.__inhouseShelfRead = read
      })(indexedDB.open('inhouse-read', 2), { records: null })
    } catch (error) { /* no IndexedDB here: the store reports it */ }
  </script>

  <script>
    // Google Identity Services only serves the web sign-in popup. The Android
    // shell signs in natively (PKCE), so its WebView skips downloading and
    // running the library while the shelf is starting.
    // It is a third-party script of its own to download and run, so it waits
    // until the page has loaded and the browser is idle (the Drive button says
    // "Google está cargando" if somebody is quicker than that).
    if (!/\bInhouseReadApp\/\d/i.test(navigator.userAgent)) {
      const loadGsi = () => {
        const gsi = document.createElement('script')
        gsi.src = 'https://accounts.google.com/gsi/client'; gsi.async = true
        document.head.append(gsi)
      }
      const whenIdle = () => ('requestIdleCallback' in window ? requestIdleCallback(loadGsi, { timeout: 4000 }) : setTimeout(loadGsi, 1500))
      if (document.readyState === 'complete') whenIdle()
      else addEventListener('load', whenIdle, { once: true })
    }
  </script>

  <script>
    // Apply the saved theme before the first paint, so the page never flashes the other one.
    (function () {
      var theme = null
      try { theme = localStorage.getItem('inhouse-read-theme') } catch (e) { /* storage blocked */ }
      if (theme === null) theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      document.documentElement.setAttribute('data-theme', theme)
    })()
  </script>
