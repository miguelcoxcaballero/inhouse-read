[package]
name = "inhouse-read-ui"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "=0.2.104"
js-sys = "=0.3.81"
web-sys = { version = "=0.3.81", features = ["Window", "Document", "Element", "Node", "HtmlElement", "HtmlButtonElement", "Event", "EventTarget", "KeyboardEvent", "DomTokenList", "HtmlCollection", "FocusOptions", "ScrollIntoViewOptions"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
