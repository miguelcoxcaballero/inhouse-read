[package]
name = "inhouse-read-ui"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = ["ui"]
ui = ["dep:num2words2-core", "dep:num-bigint"]
shelf = ["dep:rapier3d"]

[dependencies]
rapier3d = { version = "=0.36.1", default-features = false, features = ["dim3", "f32", "std", "enhanced-determinism"], optional = true }
num2words2-core = { version = "=0.1.3", optional = true }
num-bigint = { version = "=0.4.6", optional = true }
wasm-bindgen-futures = "=0.4.55"
wasm-bindgen = { version = "=0.2.105", features = ["enable-interning"] }
js-sys = "=0.3.82"
web-sys = { version = "=0.3.82", features = ["Window", "Document", "Element", "Node", "HtmlElement", "HtmlButtonElement", "Event", "EventTarget", "KeyboardEvent", "DomTokenList", "HtmlCollection", "FocusOptions", "ScrollIntoViewOptions", "CssStyleDeclaration", "DomRect", "NodeList", "Text", "Range", "MouseEvent", "HtmlCanvasElement", "console"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
# The build script explicitly selects the legacy reference/call ABI before
# stripping feature metadata. Rust and the generated JS must agree on ownership.
strip = "symbols"
